name: Pruebas Proyecto IRONMAN

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integraciones:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ejecutar pruebas
        run: npm test
